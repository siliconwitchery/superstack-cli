name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify the source is formatted
        run: |
          unformatted=$(gofmt -l .)

          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify the module files are tidy
        run: |
          go mod tidy

          changed=$(git status --porcelain -- go.mod go.sum)

          if [ -n "$changed" ]; then
            echo "go mod tidy changed the module files, commit the result:"
            echo "$changed"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

      - name: Check the installer
        run: shellcheck install.sh

      - name: Build the release the same way a tag would
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          TAP_GITHUB_TOKEN: snapshots-publish-nothing
          WINGET_GITHUB_TOKEN: snapshots-publish-nothing
          AUR_KEY: snapshots-publish-nothing
