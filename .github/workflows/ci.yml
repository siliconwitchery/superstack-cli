name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify the source is formatted
        run: |
          unformatted=$(gofmt -l .)

          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify the module files are tidy
        run: |
          go mod tidy

          changed=$(git status --porcelain -- go.mod go.sum)

          if [ -n "$changed" ]; then
            echo "go mod tidy changed the module files, commit the result:"
            echo "$changed"
            exit 1
          fi

      - name: Verify the version has not drifted past the latest release
        run: |
          declared=$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)

          # Prerelease tags are skipped, so "latest release" means the same
          # here as it does to the server's deploy guard, which reads it from
          # the releases API
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -1)

          if [ -z "$declared" ]; then
            echo "could not read 'const version' from main.go"
            exit 1
          fi

          if [ -z "$latest" ]; then
            exit 0
          fi

          latest="${latest#v}"

          declaredBase="${declared%%-*}"
          latestBase="${latest%%-*}"

          major="${latestBase%%.*}"
          withoutMajor="${latestBase#*.}"
          minor="${withoutMajor%%.*}"
          patch="${withoutMajor#*.}"

          for allowed in "$latestBase" "$major.$minor.$((patch + 1))" "$major.$((minor + 1)).0" "$((major + 1)).0.0"; do
            if [ "$declaredBase" = "$allowed" ]; then
              exit 0
            fi
          done

          echo "main.go declares $declared, but the latest release is v$latest."
          echo "The version moves one step per release, never once per cycle, so it is"
          echo "one of: $latestBase (released, awaiting the next cycle),"
          echo "$major.$minor.$((patch + 1)), $major.$((minor + 1)).0, or $((major + 1)).0.0"
          exit 1

      - run: go vet ./...

      - run: go test ./...

      - name: Build the release the same way a tag would
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          TAP_GITHUB_TOKEN: snapshots-publish-nothing
          AUR_KEY: snapshots-publish-nothing
